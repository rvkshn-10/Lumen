[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-api"
version = "0.1.0"
description = "Scientific API foundation for Lumen"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<2",
  "orjson>=3.10,<4",
  "psutil>=6,<8",
  "pydantic>=2.11,<3",
  "spiceypy>=6.0,<8",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
performance = ["numba>=0.61,<1"]
profiling = ["ittapi>=1,<2"]
openvino = ["openvino>=2025.4.1,<2027"]
copilot = ["openvino-genai==2026.4.1.0"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.services" = ["horizon_mlp_v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

