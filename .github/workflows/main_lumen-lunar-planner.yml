name: Deploy Lumen to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lumen-azure-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the frontend and prepare verified lunar data
        run: |
          npm ci
          npm run build
          python -m pip install 'numpy>=1.26,<2' 'rasterio==1.4.3'
          python scripts/data/prepare_global.py
          python scripts/data/install_cap_release.py
          python scripts/data/prepare_kernels.py
      - name: Package Lumen for Linux App Service
        run: |
          python -m pip install --target vendor ./backend
          PYTHONPATH=vendor python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health
          python scripts/verify_hosted_features.py --url http://127.0.0.1:8000
          zip -qr lumen.zip vendor backend/app apps/web/dist data/derived data/raw/kernels
      - uses: actions/upload-artifact@v4
        with:
          name: lumen
          path: lumen.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumen
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4207BEF1E92649F5AAA1978159C7C04B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_16E450F090644D418C5C9357E9AEC63C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_24A0921A3E594B259ECB299078F5157F }}
      - name: Check Azure tier and configure the prebuilt package
        run: |
          site_id=$(az webapp show --resource-group lumen --name lumen-lunar-planner --query id -o tsv)
          tier=$(az rest --method get --url "https://management.azure.com${site_id}?api-version=2025-05-01" --query properties.sku -o tsv)
          if [ "$tier" != Free ]; then
            echo "::error::Expected the existing Free F1 plan, got $tier"
            exit 1
          fi
          az webapp config appsettings set --resource-group lumen --name lumen-lunar-planner --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false LUMEN_ENV=production --output none
          az webapp config set --resource-group lumen --name lumen-lunar-planner --startup-file 'cd /home/site/wwwroot && PYTHONPATH=/home/site/wwwroot/vendor exec python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000' --output none
      - name: Deploy Lumen
        uses: azure/webapps-deploy@v3
        with:
          app-name: lumen-lunar-planner
          package: lumen.zip
      - name: Verify Azure serves the app and full lunar catalog
        run: |
          host=$(az webapp show --resource-group lumen --name lumen-lunar-planner --query defaultHostName -o tsv)
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 8 --max-time 20 "https://$host/api/v1/health"
          curl --fail --silent --show-error "https://$host/" | grep -F '/assets/index-'
          curl --fail --silent --show-error "https://$host/api/v1/coverage" | jq -e '.verified and .candidate_count == 103996'
